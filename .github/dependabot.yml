version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/project_01_enterprise_sales_data_warehouse/streaming_kafka"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/project_03_marketing_attribution_elt/streaming_kafka"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
